$kind: http-request
url: "{{baseUrl}}/movies"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 200', () => pm.response.to.have.status(200));
      pm.test('returns a JSON array', () => pm.expect(pm.response.json()).to.be.an('array'));
    language: text/javascript
order: 1000
