$kind: http-request
url: "{{baseUrl}}/series"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman Test Series",
      "year": 2025,
      "genre": "Mystery",
      "rating": 8.3,
      "duration": "8 Episode",
      "poster": "/media/test-series.jpg",
      "desc": "Data untuk pengujian CRUD Postman."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('returns 201', () => pm.response.to.have.status(201));
      const series = pm.response.json();
      pm.test('response has an id', () => {
        pm.expect(series.id).to.exist;
        pm.collectionVariables.set('seriesId', series.id);
      });
    language: text/javascript
order: 2000
