$kind: http-request
name: 5. POST /login - Password Salah (401 Unauthorized)
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{testEmail}}",
      "password": "passwordKeliru999"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () {
          pm.response.to.have.status(401);
      });
      pm.test('Notifikasi kredensial salah', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.error).to.include('salah');
      });
    language: text/javascript
order: 5000
